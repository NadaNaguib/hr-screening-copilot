name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: hr_screening
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint with ruff
        run: ruff check src tests scripts eval
      - name: Type check with mypy
        run: mypy src
      - name: Create test database
        env:
          PGPASSWORD: copilot
        run: psql -h localhost -U copilot -d hr_screening -c "CREATE DATABASE hr_screening_test;"
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://copilot:copilot@localhost:5432/hr_screening
          TEST_DATABASE_URL: postgresql+asyncpg://copilot:copilot@localhost:5432/hr_screening_test
          JWT_SECRET: ci-test-secret-not-for-production
        run: |
          alembic upgrade head
          pytest
      - name: Run pip-audit
        run: pip-audit --requirement <(pip freeze)
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
