[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hr-screening-copilot"
version = "0.1.0"
description = "Domain Copilot HR Talent Screening Platform (D6 + T5)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Nada Naguib" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",
    "langgraph>=0.0.65",
    "langchain-core>=0.2.0",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "aiofiles>=23.2.0",
    "apscheduler>=3.10.4",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "jinja2>=3.1.4",
    "reportlab>=4.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "N", "ASYNC"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]
